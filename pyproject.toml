[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldline-engine"
version = "0.3.0"
description = "Deterministic alternate-history simulation core"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["worldline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
